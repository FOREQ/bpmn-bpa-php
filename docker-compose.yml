services:
  app:
    build: .
    # Секреты (ключи ИИ, почта) — в файле .env рядом с docker-compose.yml.
    # Шаблон переменных ИИ: .env.ai.example
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - composer-cache:/tmp/composer-cache
      - vendor:/app/vendor
    environment:
      COMPOSER_CACHE_DIR: /tmp/composer-cache
      # По умолчанию используется SQLite (файл database/database.sqlite),
      # ничего дополнительно настраивать не нужно.
      #
      # Чтобы подключиться к PostgreSQL — раскомментируйте и заполните:
      # DB_DRIVER: pgsql
      # DB_HOST: db
      # DB_PORT: "5432"
      # DB_NAME: bpmn
      # DB_USER: postgres
      # DB_PASSWORD: postgres
      #
      # Почта: значения берутся из файла .env рядом с docker-compose.yml
      # (скопируйте .env.example в .env и заполните). Пароли в git не храним.
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-BPMN Testing System}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-starttls}

volumes:
  composer-cache:
  vendor:
